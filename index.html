<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wix Headless Bookings</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; background-color: #f9f9f9; }
        h1 { color: #111; text-align: center; }
        #wix-services-list { margin-top: 30px; }
        .service-card { background: white; border: 1px solid #e2e8f0; padding: 24px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .service-title { margin: 0 0 8px 0; font-size: 1.25rem; color: #1a202c; }
        .service-desc { color: #4a5568; font-size: 0.95rem; margin-bottom: 16px; line-height: 1.5; }
        .book-btn { background-color: #000; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; }
        .book-btn:hover { background-color: #2d3748; }
    </style>
</head>
<body>

    <h1>Our Bookable Services</h1>
    <div id="wix-services-list">Loading services from your Wix backend...</div>
    <!-- Mantenemos los scripts de UNPKG que funcionaron perfectamente sin bloquearse -->
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>

    <script>
      async function displayServices() {
        try {
          // Corrección de los objetos globales nativos generados por los bundles UMD de Wix
          const { createClient, OAuthStrategy } = window.wix || window.wixSdk || {};
          const { services } = window.bookings || window.wixBookings || {};

          if (!createClient) {
            console.log("Estructura detectada en window:", window.wix, window.bookings);
            throw new Error("No se encontró el inicializador de la librería en el navegador.");
          }

          // Inicializamos el cliente conectándolo a tu proyecto Headless con tu ID real
          const wixClient = createClient({
            modules: { services },
            auth: OAuthStrategy({ clientId: 'a77aaff4-a8b2-499a-9b71-fe8ae575d70d' })
          });

          // Hacemos la consulta directa a tus servicios de Wix Bookings
          const response = await wixClient.services.queryServices().find();
          const listContainer = document.getElementById('wix-services-list');
          
          if (!response.items || response.items.length === 0) {
            listContainer.innerHTML = "<p style='text-align:center;'>No se encontraron servicios públicos en tu panel de control de Wix.</p>";
            return;
          }

          // Inyectamos dinámicamente los servicios en la interfaz
          listContainer.innerHTML = response.items.map(service => `
            <div class="service-card">
              <h3 class="service-title">${service.name}</h3>
              <p class="service-desc">${service.description || 'No hay descripción disponible para este servicio.'}</p>
              <button class="book-btn">Reservar Cita</button>
            </div>
          `).join('');
        } catch (err) {
          console.error("Error al conectar con Wix:", err);
          document.getElementById('wix-services-list').innerHTML = `<p style='color:red; text-align:center;'>Error de inicialización: ${err.message || 'No se pudo mapear el backend.'}</p>`;
        }
      }

      // Ejecutar de forma segura cuando todo el documento esté estructurado
      window.onload = displayServices;
    </script>

</body>
</html>
